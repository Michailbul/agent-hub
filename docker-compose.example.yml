# Example: self-hosted setup for OpenClaw users
# Copy to docker-compose.yml and adjust paths for your machine

services:
  agent-hub:
    image: ghcr.io/laniameda/agent-hub:latest
    ports:
      - "4001:4001"
    restart: unless-stopped
    environment:
      HUB_PASSWORD: "your-secure-password"
      OPENCLAW_ROOT: "/root/.openclaw"
      AGENTS_SKILLS_ROOT: "/root/.agents/skills"
    volumes:
      # Core OpenClaw dirs
      - ~/.openclaw:/root/.openclaw
      - ~/.agents:/root/.agents
      # Claude Code skills (~/.claude/skills/) — required to show Claude Code skills in Skills Lab
      - ~/.claude:/root/.claude
      # Codex CLI skills (~/.codex/skills/) — required to show Codex skills in Skills Lab
      - ~/.codex:/root/.codex
      # Optional: map a studio/HQ context directory
      # - ~/work/my-studio:/root/work/my-studio
